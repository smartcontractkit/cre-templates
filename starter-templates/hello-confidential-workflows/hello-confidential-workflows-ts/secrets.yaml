# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID your workflow requests with `runtime.getSecret({ id })`
# to the environment variable holding its value.
#
# In a Confidential Workflow these are released by the Vault DON directly into
# the attested enclave — they are never exposed in plaintext to node operators
# or to Workflow DON node memory.
#
# Secrets are the data the enclave keeps confidential, alongside the request and
# response payloads of HTTP calls made from the enclave and other intermediate
# values. The workflow binary the Workflow DON provides to the enclave, including
# the logic executed there, is not confidential.
secretsNames:
    API_TOKEN:
        - SECRET_API_TOKEN
