# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
# Workflow-specific settings for CRE CLI targets.
# Each target defines user-workflow and workflow-artifacts groups.
# Settings here override CRE Project Settings File values.
#
# For Go workflows, workflow-path points at the package directory (".") rather
# than a single entry file — the whole package is compiled to WASM.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "automated-liquidation-protection-go-staging"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "automated-liquidation-protection-go-production"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
