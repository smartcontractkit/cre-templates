kind: starter-template
id: automated-liquidation-protection-ts
projectDir: .
title: "Automated Liquidation Protection"
description: "Monitor DeFi lending risk and execute confidential policy-constrained defensive actions to reduce liquidation exposure."
language: typescript
category: workflow
capabilities:
  - cron
  - http
tags:
  - defi
  - liquidation
  - risk-management
  - lending
  - automation
  - confidential-workflow
  - confidential
workflows:
  - dir: automated-liquidation-protection-ts
postInit: |
  This workflow evaluates liquidation signals and executes defensive actions through HTTP endpoints.
  
  1. In the project root, configure .env values using `cp .env.example .env`
  2. From within the workflow directory (defaults to my-workflow), run `bun install` and then `bun run mock:server`
  3. In the project root, execute `cre workflow simulate ./my-workflow`
  
  The mock server for this project serves routes under /liquidation/*.
