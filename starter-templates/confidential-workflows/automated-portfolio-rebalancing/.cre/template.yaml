kind: starter-template
id: automated-portfolio-rebalancing-ts
projectDir: .
title: "Automated Portfolio Rebalancing"
description: "Continuously monitor allocation drift and execute confidential, policy-constrained portfolio rebalancing actions."
language: typescript
category: workflow
capabilities:
  - cron
  - http
tags:
  - portfolio
  - rebalancing
  - trading
  - automation
  - risk-management
  - confidential-workflow
  - confidential
workflows:
  - dir: automated-portfolio-rebalancing-ts
postInit: |
  This workflow monitors portfolio drift, generates rebalance actions, and executes through HTTP endpoints.
  
  1. In the project root, configure .env values using `cp .env.example .env`
  2. From within the workflow directory (defaults to my-workflow), run `bun install` and then `bun run mock:server`
  3. In the project root, execute `cre workflow simulate ./my-workflow`
  
  The mock server for this project serves routes under /rebalancing/*.
