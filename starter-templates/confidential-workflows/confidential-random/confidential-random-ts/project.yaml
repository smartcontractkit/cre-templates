# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# This workflow generates randomness off-chain and does not read from or write
# to a chain. The RPCs are here so you can extend it with an on-chain write
# without extra setup.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
