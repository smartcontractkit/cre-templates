kind: starter-template
id: ai-audit-firewall-ts
projectDir: .
title: "AI Smart Contract Audit Firewall"
description: "Analyze and screen proposed smart contract interactions before execution, then allow, deny, or escalate based on confidential risk analysis."
language: typescript
category: workflow
capabilities:
  - cron
  - http
  - chain-read
  - chain-write
tags:
  - security
  - smart-contracts
  - firewall
  - ai-audit
  - risk-management
  - confidential-workflow
  - confidential
workflows:
  - dir: ai-audit-firewall-ts
postInit: |
  This workflow uses scanner APIs and dual-model reasoning endpoints via the local mock server.
  
  1. In the project root, configure .env values using `cp .env.example .env`
  2. From within the workflow directory (defaults to my-workflow), run `bun install` and then `bun run mock:server`
  3. In the project root, execute `cre workflow simulate ./my-workflow`
  
  Optional onchain verdict delivery: Deploy AuditFirewallConsumer.sol from the ai-audit-firewall-ts/contracts directory, then set the deployed contract address in ai-audit-firewall-ts/config.staging.json under evms[0].consumer_address.
