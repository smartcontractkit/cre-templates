[package]
name = "kv-store-receiver"
version = "0.1.0"
description = "Minimal CRE keystone receiver that stores a key/value pair on Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "kv_store_receiver"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.0"
anchor-attribute-access-control = "=0.31.0"
anchor-attribute-account = "=0.31.0"
anchor-attribute-constant = "=0.31.0"
anchor-attribute-error = "=0.31.0"
anchor-attribute-event = "=0.31.0"
anchor-attribute-program = "=0.31.0"
anchor-derive-accounts = "=0.31.0"
anchor-derive-serde = "=0.31.0"
blake3 = "=1.7.0"
borsh = "=1.5.1"
proc-macro-crate = "=3.1.0"
zeroize = "=1.8.1"
hashbrown = "=0.15.5"
indexmap = "=2.6.0"
unicode-segmentation = "=1.12.0"
solana-program = "=2.1.21"
proc-macro2 = "=1.0.89"
